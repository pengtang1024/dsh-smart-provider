name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url: setup-node then writes no `_authToken` line, and npm
      # can reach the OIDC exchange instead of sending a dummy token.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled one may be older.
      - name: Upgrade npm
        run: |
          npm install --global npm@latest
          npm --version
          npm config get registry

      - name: Check syntax
        run: node --check client.js

      - name: Run tests
        run: node scripts/run-tests.mjs

      - name: Check package payload
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "const p=require('/tmp/pack.json')[0].files.map(f=>f.path); for(const f of ['client.js','cordis.patch.yml','lib/index.js','registry/registry-lib.mjs','locale/en.json']) if(!p.includes(f)) throw new Error('missing from tarball: '+f)"

      - name: OIDC preflight
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "OIDC env: present"; else echo "OIDC env: MISSING"; fi

      # No NODE_AUTH_TOKEN: npm exchanges the GitHub OIDC token for a short-lived
      # registry credential. The trusted publisher must be configured on
      # npmjs.com first (package settings → Trusted Publisher → GitHub Actions).
      - name: Publish
        run: npm publish --provenance --access public --loglevel=verbose
